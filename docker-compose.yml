services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DD_DIALOGUE_MODE: ollama
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    volumes:
      - detective-data:/workspace/data
  frontend:
    build:
      context: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
volumes:
  detective-data:
